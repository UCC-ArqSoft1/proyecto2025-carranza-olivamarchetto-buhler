basePath: /
definitions:
  dto.ActivityRequest:
    properties:
      capacity:
        type: integer
      category_id:
        type: integer
      day:
        enum:
        - Lunes
        - Martes
        - Miercoles
        - Jueves
        - Viernes
        - Sabado
        - Domingo
        type: string
      duration:
        type: integer
      frequency:
        enum:
        - Semanal
        - Mensual
        - Unica
        type: string
      image_url:
        type: string
      name:
        minLength: 3
        type: string
      start_hour:
        description: '"HH:MM"'
        type: string
    required:
    - capacity
    - category_id
    - day
    - duration
    - frequency
    - name
    - start_hour
    type: object
  dto.ActivityResponse:
    properties:
      capacity:
        type: integer
      category:
        allOf:
        - $ref: '#/definitions/dto.CategoryResponse'
        description: ← nil si no precargas
      category_id:
        type: integer
      day:
        type: string
      duration:
        type: integer
      frequency:
        type: string
      id:
        type: integer
      image_url:
        type: string
      name:
        type: string
      start_hour:
        type: string
    type: object
  dto.ActivityStatsResponse:
    properties:
      activity_id:
        type: integer
      activity_name:
        type: string
      available_spots:
        type: integer
      capacity:
        type: integer
      category_name:
        type: string
      current_enrolled:
        type: integer
      day:
        type: string
      occupancy_rate:
        description: Porcentaje de ocupación
        type: number
      start_hour:
        type: string
    type: object
  dto.CategoryRequest:
    properties:
      name:
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.CategoryResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.DayStatsResponse:
    properties:
      day:
        type: string
      total_activities:
        type: integer
      total_enrollments:
        type: integer
    type: object
  dto.EnrollmentStatsResponse:
    properties:
      average_per_activity:
        type: number
      average_per_user:
        type: number
      least_popular_day:
        type: string
      most_popular_day:
        type: string
      total_enrollments:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  dto.PopularActivityResponse:
    properties:
      activity_id:
        type: integer
      activity_name:
        type: string
      capacity:
        type: integer
      category_name:
        type: string
      day:
        type: string
      enrollment_count:
        type: integer
      occupancy_rate:
        type: number
      rank:
        description: Posición en el ranking
        type: integer
      start_hour:
        type: string
    type: object
  dto.ProfileResponse:
    properties:
      id:
        type: integer
      role:
        $ref: '#/definitions/dto.UserRole'
      username:
        type: string
    type: object
  dto.ProfileUpdateRequest:
    properties:
      username:
        type: string
    required:
    - username
    type: object
  dto.RegistrationResponse:
    properties:
      activity_id:
        type: integer
      id:
        type: integer
      user_id:
        type: integer
    type: object
  dto.UserRequest:
    properties:
      password:
        minLength: 8
        type: string
      role:
        allOf:
        - $ref: '#/definitions/dto.UserRole'
        enum:
        - admin
        - socio
      username:
        type: string
    required:
    - password
    - role
    - username
    type: object
  dto.UserResponse:
    properties:
      id:
        type: integer
      role:
        $ref: '#/definitions/dto.UserRole'
      username:
        type: string
    type: object
  dto.UserRole:
    enum:
    - admin
    - socio
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleSocio
  dto.UserStatsResponse:
    properties:
      active_users:
        description: Usuarios con al menos 1 inscripción
        type: integer
      inactive_users:
        description: Usuarios sin inscripciones
        type: integer
      total_admins:
        type: integer
      total_socios:
        type: integer
      total_users:
        type: integer
    type: object
  dto.UserUpdateRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/dto.UserRole'
        enum:
        - admin
        - socio
      username:
        type: string
    required:
    - role
    - username
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: http://www.swagger.io/support
  description: API para la gestión de un gimnasio.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Proyecto Gimnasio API
  version: "1.0"
paths:
  /activities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ActivityResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar todas las actividades
      tags:
      - Actividades
  /activities/{id}:
    get:
      parameters:
      - description: ID de la actividad
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActivityResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener una actividad por ID
      tags:
      - Actividades
  /activities/{id}/enrollments:
    get:
      parameters:
      - description: ID de la actividad
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ver usuarios inscritos en una actividad (solo admin)
      tags:
      - Inscripciones
  /activities/{id}/unenroll:
    delete:
      parameters:
      - description: ID de la actividad
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Desinscribirse de una actividad
      tags:
      - Inscripciones
  /activities/enroll:
    post:
      consumes:
      - application/json
      parameters:
      - description: Solo activity_id (user_id viene del token)
        in: body
        name: enrollment
        required: true
        schema:
          properties:
            activity_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegistrationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inscribir usuario en una actividad
      tags:
      - Inscripciones
  /admin/activities:
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos de la actividad
        in: body
        name: activity
        required: true
        schema:
          $ref: '#/definitions/dto.ActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ActivityResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Crear una nueva actividad
      tags:
      - Actividades
  /admin/activities/{id}:
    delete:
      parameters:
      - description: ID de la actividad
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Eliminar una actividad
      tags:
      - Actividades
    put:
      consumes:
      - application/json
      parameters:
      - description: ID de la actividad
        in: path
        name: id
        required: true
        type: integer
      - description: Datos actualizados
        in: body
        name: activity
        required: true
        schema:
          $ref: '#/definitions/dto.ActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActivityResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualizar una actividad existente
      tags:
      - Actividades
  /admin/stats/activities:
    get:
      description: Retorna estadísticas detalladas de todas las actividades incluyendo
        ocupación, cupos disponibles, etc.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ActivityStatsResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener estadísticas de todas las actividades
      tags:
      - Estadísticas
  /admin/stats/days:
    get:
      description: Retorna estadísticas agrupadas por día de la semana
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DayStatsResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener estadísticas por día de la semana
      tags:
      - Estadísticas
  /admin/stats/enrollments:
    get:
      description: 'Retorna estadísticas generales de inscripciones: totales, promedios,
        días populares'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EnrollmentStatsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener estadísticas de inscripciones
      tags:
      - Estadísticas
  /admin/stats/popular-activities:
    get:
      description: Retorna las actividades ordenadas por número de inscripciones (ranking)
      parameters:
      - description: 'Límite de resultados (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PopularActivityResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener actividades más populares
      tags:
      - Estadísticas
  /admin/stats/users:
    get:
      description: 'Retorna estadísticas generales del sistema de usuarios: totales
        por rol, activos/inactivos'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserStatsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener estadísticas de usuarios
      tags:
      - Estadísticas
  /admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar todos los usuarios (solo admin)
      tags:
      - Administración de Usuarios
  /admin/users/{id}:
    delete:
      parameters:
      - description: ID del usuario
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Eliminar usuario (solo admin)
      tags:
      - Administración de Usuarios
    put:
      consumes:
      - application/json
      parameters:
      - description: ID del usuario
        in: path
        name: id
        required: true
        type: integer
      - description: Datos actualizados
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UserUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualizar usuario (solo admin)
      tags:
      - Administración de Usuarios
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CategoryResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar todas las categorías
      tags:
      - Categorías
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos de la categoría
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Crear una nueva categoría
      tags:
      - Categorías
  /categories/{id}:
    delete:
      parameters:
      - description: ID de la categoría
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Eliminar una categoría
      tags:
      - Categorías
    put:
      consumes:
      - application/json
      parameters:
      - description: ID de la categoría
        in: path
        name: id
        required: true
        type: integer
      - description: Datos actualizados
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualizar una categoría
      tags:
      - Categorías
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credenciales de usuario
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión
      tags:
      - Autenticación
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos del usuario
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registrar nuevo usuario
      tags:
      - Autenticación
  /users/{user_id}/activities:
    get:
      parameters:
      - description: ID del usuario
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ActivityResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ver actividades de un usuario
      tags:
      - Inscripciones
  /users/change-password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Contraseñas
        in: body
        name: passwords
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cambiar contraseña
      tags:
      - Perfil de Usuario
  /users/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ver perfil propio
      tags:
      - Perfil de Usuario
    put:
      consumes:
      - application/json
      parameters:
      - description: Datos del perfil
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/dto.ProfileUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualizar perfil propio
      tags:
      - Perfil de Usuario
swagger: "2.0"
